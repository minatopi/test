
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Zoom Meeting</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10131c;color:white;font-family:Arial,"Noto Sans JP",sans-serif}.app{max-width:1200px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.logo{font-size:23px;font-weight:bold;color:#70a5ff}.status{color:#64dfad;font-size:13px}.panel{background:#1b2030;border:1px solid #30394d;border-radius:16px;padding:24px;margin-bottom:18px}.hero{text-align:center;padding:35px 15px}.hero h1{font-size:30px;margin:10px}.hero p{color:#aeb9ce}.field{width:100%;padding:14px;background:#101725;border:1px solid #43506a;border-radius:9px;color:white;margin:8px 0 16px;font-size:16px}.btn{padding:13px 20px;border:0;border-radius:9px;background:#3978ee;color:white;font-weight:bold;cursor:pointer;font-size:15px}.btn:hover{filter:brightness(1.15)}.secondary{background:#354158}.green{background:#168d68}.meeting{display:none}.meeting iframe{width:100%;height:72vh;min-height:450px;border:0;border-radius:12px;background:#000}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.room{font-size:13px;color:#aeb9ce;margin-bottom:12px}.footer{text-align:center;color:#78849a;font-size:12px;margin-top:25px}
</style>
</head>
<body>
<div class="app">
<header class="head">
<div class="logo">● My Meeting</div>
<div class="status">● ONLINE</div>
</header>

<section class="panel hero" id="home">
<h1>オンライン会議</h1>
<p>いつでも、どこでも、みんなとつながる。</p>
<label>あなたの名前</label>
<input class="field" id="username" placeholder="名前を入力してください" maxlength="40">
<div class="room">会議ID：<span id="roomid"></span></div>
<button class="btn" onclick="join()">▶ 会議を開始・参加する</button>
<button class="btn secondary" onclick="copyLink()">招待URLをコピー</button>
</section>

<section class="meeting" id="meeting">
<div class="panel">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
<strong>● LIVE MEETING</strong>
<button class="btn secondary" onclick="copyLink()">🔗 招待URLをコピー</button>
</div>
<div class="room">会議ID：<span id="roomid2"></span></div>
<div class="actions">
<button class="btn secondary" onclick="toggleFull()">⛶ 全画面</button>
<button class="btn green" onclick="copyLink()">参加者を招待</button>
<button class="btn" style="background:#d63c50" onclick="leave()">通話を終了</button>
</div>
<div id="jitsi"></div>
</div>
</section>
<div class="footer">Powered by Jitsi Meet · WebRTC</div>
</div>

<script src="https://meet.jit.si/external_api.js"></script>
<script>
const params=new URLSearchParams(location.search);
const randomRoom=()=> 'Meeting-'+Math.random().toString(36).slice(2,10);
let room=params.get('room')||randomRoom();
let api=null;
const $=id=>document.getElementById(id);
$('roomid').textContent=room;
$('roomid2').textContent=room;
if(!params.get('room')&&location.protocol!=='file:'){
 history.replaceState({},'', '?room='+encodeURIComponent(room));
}
function inviteURL(){
 return location.href.split('?')[0]+'?room='+encodeURIComponent(room);
}
async function copyLink(){
 try{
  await navigator.clipboard.writeText(inviteURL());
  alert('招待URLをコピーしました！相手に送ってください。');
 }catch(e){
  prompt('こちらのURLをコピーしてください',inviteURL());
 }
}
function join(){
 const name=$('username').value.trim()||'ゲスト';
 if(typeof JitsiMeetExternalAPI==='undefined'){
  alert('会議サービスを読み込めません。インターネット接続を確認してください。');
  return;
 }
 $('home').style.display='none';
 $('meeting').style.display='block';
 if(api)api.dispose();
 api=new JitsiMeetExternalAPI('meet.jit.si',{
  roomName:room,
  parentNode:$('jitsi'),
  width:'100%',
  height:'72vh',
  userInfo:{displayName:name},
  configOverwrite:{
   prejoinPageEnabled:false,
   startWithAudioMuted:false,
   startWithVideoMuted:false,
   disableDeepLinking:true
  },
  interfaceConfigOverwrite:{
   TOOLBAR_BUTTONS:[
    'microphone','camera','desktop','chat','raisehand',
    'tileview','fullscreen','hangup','settings',
    'participants-pane','select-background','mute-everyone'
   ]
  }
 });
 api.addListener('readyToClose',()=>{
  api.dispose();api=null;
  $('meeting').style.display='none';
  $('home').style.display='block';
 });
}
function leave(){
 if(api){api.executeCommand('hangup');}
}
function toggleFull(){
 const el=$('jitsi');
 if(!document.fullscreenElement)el.requestFullscreen?.();
 else document.exitFullscreen?.();
}
</script>
</body>
</html>
