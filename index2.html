
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Zoom</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

<h1>Mini Zoom</h1>

<div id="join">
  <input id="username" placeholder="名前">
  <input id="roomid" value="123456" placeholder="ルームID">
  <button onclick="join()">参加する</button>
</div>

<div id="meeting" hidden>
  <p id="status">接続中...</p>
  <h3>自分</h3>
  <video id="local" autoplay muted playsinline width="320"></video>
  <div id="videos"></div>
</div>

<div id="controls" hidden>
  <button onclick="toggleMic()" id="mic">マイクON</button>
  <button onclick="toggleCam()" id="cam">カメラON</button>
  <button onclick="shareScreen()" id="share">画面共有</button>
  <button onclick="leave()">退室</button>
</div>

<script>
const BROKER="wss://broker.emqx.io:8084/mqtt";
const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
const $=id=>document.getElementById(id);

let client,stream,screenStream,room,myId,myName,joinedAt;
let peers={};
let micOn=true,camOn=true,sharing=false,closed=false;

function topic(s){return `minizoom/${room}/${s}`}
function send(to,data){
 if(client?.connected)
 client.publish(topic(`signal/${to}`),JSON.stringify({from:myId,data}));
}
function publishPresence(){
 if(client?.connected)
 client.publish(topic(`presence/${myId}`),
 JSON.stringify({id:myId,name:myName,time:joinedAt}),
 {retain:true});
}
function compare(a,b){
 return a.time-b.time||a.id.localeCompare(b.id);
}

async function join(){
 myName=$("username").value.trim()||"Guest";
 room=$("roomid").value.trim();
 if(!room)return alert("ルームIDを入力してください");

 try{
  stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  $("local").srcObject=stream;
  $("join").hidden=true;
  $("meeting").hidden=false;
  $("controls").hidden=false;

  myId="u"+Math.random().toString(36).slice(2,14);
  joinedAt=Date.now();
  closed=false;

  client=mqtt.connect(BROKER,{
   clientId:"mz"+myId,
   clean:true,
   connectTimeout:10000,
   reconnectPeriod:3000,
   will:{topic:topic(`presence/${myId}`),payload:"",retain:true}
  });

  client.on("connect",()=>{
   if(closed)return;
   $("status").textContent="MQTT接続済み";
   client.subscribe([topic("presence/+"),topic(`signal/${myId}`)],publishPresence);
  });

  client.on("message",async(t,p)=>{
   if(closed)return;
   try{
    const msg=p.toString();

    if(t.startsWith(topic("presence/"))){
     const id=t.split("/").pop();
     if(id===myId)return;
     if(!msg){removePeer(id);return}

     const person=JSON.parse(msg);
     if(!person.id||peers[id])return;

     const peer=createPeer(person);
     if(compare({id:myId,time:joinedAt},person)<0)
      await makeOffer(peer);

     updateStatus();
    }

    if(t===topic(`signal/${myId}`)){
     const packet=JSON.parse(msg);
     if(packet.from&&packet.data)
      await handleSignal(packet.from,packet.data);
    }
   }catch(e){console.error(e)}
  });

  client.on("offline",()=>{
   $("status").textContent="MQTT再接続中";
  });

 }catch(e){alert(e.message)}
}

function createPeer(person){
 const pc=new RTCPeerConnection(ICE);
 const peer={pc,person,candidates:[]};
 peers[person.id]=peer;

 stream.getTracks().forEach(t=>pc.addTrack(t,stream));

 pc.onicecandidate=e=>{
  if(e.candidate)
   send(person.id,{type:"candidate",candidate:e.candidate});
 };

 pc.ontrack=e=>{
  let v=$("video-"+person.id);
  if(!v){
   const div=document.createElement("div");
   const label=document.createElement("p");
   label.textContent=person.name||"参加者";
   v=document.createElement("video");
   v.id="video-"+person.id;
   v.autoplay=true;
   v.playsInline=true;
   v.width=320;
   div.append(label,v);
   div.id="card-"+person.id;
   $("videos").append(div);
  }
  if(v.srcObject!==e.streams[0])v.srcObject=e.streams[0];
 };

 pc.onconnectionstatechange=()=>{
  if(pc.connectionState==="failed"||pc.connectionState==="closed")
   removePeer(person.id);
  updateStatus();
 };
 return peer;
}

async function makeOffer(peer){
 try{
  const offer=await peer.pc.createOffer();
  await peer.pc.setLocalDescription(offer);
  send(peer.person.id,{type:"offer",description:peer.pc.localDescription});
 }catch(e){console.error(e)}
}

async function handleSignal(from,data){
 const peer=peers[from];
 if(!peer)return;
 const pc=peer.pc;

 try{
  if(data.type==="offer"){
   await pc.setRemoteDescription(data.description);
   const answer=await pc.createAnswer();
   await pc.setLocalDescription(answer);
   send(from,{type:"answer",description:pc.localDescription});
   await flush(peer);
  }
  else if(data.type==="answer"){
   await pc.setRemoteDescription(data.description);
   await flush(peer);
  }
  else if(data.type==="candidate"){
   if(pc.remoteDescription)
    await pc.addIceCandidate(data.candidate);
   else peer.candidates.push(data.candidate);
  }
 }catch(e){console.error(e)}
}

async function flush(peer){
 for(const c of peer.candidates)
  await peer.pc.addIceCandidate(c);
 peer.candidates=[];
}

function removePeer(id){
 if(peers[id]){
  peers[id].pc.close();
  delete peers[id];
 }
 const card=$("card-"+id);
 if(card)card.remove();
 updateStatus();
}

function updateStatus(){
 $("status").textContent="参加人数: "+(Object.keys(peers).length+1)+"人";
}

function toggleMic(){
 micOn=!micOn;
 stream.getAudioTracks().forEach(t=>t.enabled=micOn);
 $("mic").textContent=micOn?"マイクON":"マイクOFF";
}

function toggleCam(){
 camOn=!camOn;
 stream.getVideoTracks().forEach(t=>t.enabled=camOn);
 $("cam").textContent=camOn?"カメラON":"カメラOFF";
}

async function shareScreen(){
 if(sharing){await stopShare();return}
 try{
  screenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
  const track=screenStream.getVideoTracks()[0];
  const tasks=[];

  for(const id in peers){
   const sender=peers[id].pc.getSenders()
    .find(s=>s.track?.kind==="video");
   if(sender)tasks.push(sender.replaceTrack(track));
  }

  await Promise.all(tasks);
  $("local").srcObject=screenStream;
  sharing=true;
  $("share").textContent="共有終了";
  track.onended=()=>stopShare();
 }catch(e){console.error(e)}
}

async function stopShare(){
 if(!sharing)return;
 sharing=false;
 const track=stream.getVideoTracks()[0];
 const tasks=[];

 for(const id in peers){
  const sender=peers[id].pc.getSenders()
   .find(s=>s.track?.kind==="video");
  if(sender)tasks.push(sender.replaceTrack(track));
 }
 await Promise.all(tasks);

 if(screenStream){
  screenStream.getTracks().forEach(t=>t.stop());
  screenStream=null;
 }
 $("local").srcObject=stream;
 $("share").textContent="画面共有";
}

async function leave(){
 if(closed)return;
 closed=true;
 if(screenStream)screenStream.getTracks().forEach(t=>t.stop());

 if(client){
  if(client.connected)
   client.publish(topic(`presence/${myId}`),"",{retain:true});
  client.end(true);
 }

 Object.keys(peers).forEach(removePeer);
 if(stream)stream.getTracks().forEach(t=>t.stop());
 location.reload();
}

window.addEventListener("beforeunload",()=>{
 if(client&&client.connected)
  client.publish(topic(`presence/${myId}`),"",{retain:true});
});
</script>
</body>
</html>
